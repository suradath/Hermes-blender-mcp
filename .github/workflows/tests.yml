name: tests

# รันชุดทดสอบทั้งหมดบน GitHub ทุกครั้งที่ push/PR
# ข้อดี: ชุดทดสอบของโปรเจกต์นี้ **ไม่ต้องมี Blender** (ใช้ bpy ปลอม)
# จึงรันบน runner ธรรมดาได้ และเป็นหลักฐานสาธารณะว่าของยังใช้ได้จริง
#
# หลังอัปขึ้น GitHub แล้ว ใส่ป้ายสถานะใน README ได้ด้วยบรรทัดนี้:
#   [![tests](https://github.com/<OWNER>/<REPO>/actions/workflows/tests.yml/badge.svg)](https://github.com/<OWNER>/<REPO>/actions/workflows/tests.yml)

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# ต้องมีสิทธิ์เขียน เพื่อโพสต์รายละเอียดเมื่อชุดทดสอบล้ม (commit comment สาธารณะ)
permissions:
  contents: write

jobs:
  test:
    name: tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 = เวอร์ชันต่ำสุดที่ mcp 2.x รองรับ · 3.12 = ตัวที่ใช้ทดสอบจริง
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: ติดตั้งแพ็กเกจ
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: ตรวจไวยากรณ์ทุกไฟล์
        run: python -m py_compile blender_mcp_server.py blender_bridge.py blender_addon/__init__.py tools/build_addon_zip.py tests/*.py

      - name: ตรวจว่า stdout ว่างตอนสตาร์ต (ท่อ JSON-RPC ต้องสะอาด)
        run: |
          # ใช้ $! ไม่ใช่ %1 — GitHub รันเชลล์แบบไม่โต้ตอบ (ไม่มี job control)
          python blender_mcp_server.py --log-file /tmp/ci.log < /dev/null > /tmp/stdout.txt 2>/tmp/stderr.txt &
          PID=$!
          sleep 6
          kill "$PID" 2>/dev/null || true
          wait "$PID" 2>/dev/null || true
          BYTES=$(wc -c < /tmp/stdout.txt)
          echo "stdout = $BYTES ไบต์"
          if [ "$BYTES" -ne 0 ]; then
            echo "❌ มีอะไรเขียนลง stdout — จะทำให้ JSON-RPC พัง:"
            cat /tmp/stdout.txt
            exit 1
          fi

      - name: สร้าง zip ของ add-on (ต้องได้โครงสร้างถูกต้อง)
        run: python tools/build_addon_zip.py

      # ── ชุดทดสอบ ────────────────────────────────────────────────────────
      # รันผ่าน run_all.sh (บันทึกละเอียดไว้ที่ /tmp/blender_mcp_test_*.log)
      - name: รันชุดทดสอบทั้งหมด
        run: bash tests/run_all.sh

      # log ของ runner ต้องล็อกอินถึงจะอ่านได้ แต่ **commit comment เปิดเผยสาธารณะ**
      # จึงโพสต์รายละเอียดของชุดที่ล้มไว้ที่ commit นั้น เพื่อให้ตรวจจากระยะไกลได้
      # โดยไม่ต้องมีสิทธิ์เข้าถึง repo  (ต้องมี permissions: contents: write)
      - name: รายละเอียดเมื่อล้ม (ขึ้นใน job summary + commit comment)
        if: failure()
        run: |
          {
            echo "## ❌ ชุดทดสอบที่ล้ม (Python ${{ matrix.python-version }})"
            found=0
            for f in /tmp/blender_mcp_test_*.log; do
              [ -f "$f" ] || continue
              if grep -q "ล้มเหลว" "$f"; then
                found=1
                echo ""
                echo "### $(basename "$f" .log)"
                echo '```'
                tail -40 "$f"
                echo '```'
              fi
            done
            if [ "$found" = "0" ]; then
              echo ""
              echo "ไม่พบ log ของชุดที่ล้ม (อาจล้มก่อนถึงขั้นรันชุดทดสอบ)"
              ls -la /tmp/blender_mcp_test_*.log 2>/dev/null || echo "ไม่มีไฟล์ log เลย"
            fi
          } > /tmp/report.md
          cat /tmp/report.md >> "$GITHUB_STEP_SUMMARY"
          head -c 60000 /tmp/report.md > /tmp/report-trim.md
          gh api -X POST "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -F body=@/tmp/report-trim.md || echo "โพสต์ commit comment ไม่สำเร็จ"
